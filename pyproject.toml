[project]
name = "tracer-transfer"
version = "0.1.3"
description = "Transferência segura de arquivos de tracer"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "argon2-cffi>=23", "pystray>=0.19", "pillow>=11", "cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=44"]
build = ["pyinstaller>=6.19"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
